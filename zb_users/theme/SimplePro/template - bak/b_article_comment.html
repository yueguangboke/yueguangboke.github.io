<ol class="commentlist">
	<li class="comment even thread-even depth-1 parent" id="comment-<#article/comment/id#>">
		<div id="div-comment-<#article/comment/id#>" class="comment-body">
		<div class="comment-author vcard">
		<div style="float:right"><#article/comment/count#></div><cite class="fn"><a name="cmt<#article/comment/id#>"><#article/comment/name#></a></cite> &nbsp; <span class="says">说道：</span>		</div>
		<div class="comment-meta commentmetadata">		</div>
		<#article/comment/content#>
		<div class="reply"><span style="float:left" class="comment-meta commentmetadata"><#article/comment/posttime#></span>		
		<span id="note<#article/comment/id#>"></span><a href="javascript:commDig(<#article/comment/id#>);">支持</a>(<span id="sdig<#article/comment/id#>"><#article/comment/digg#></span>)&nbsp;<a href="javascript:commDown(<#article/comment/id#>);">反对</a>(<span id="sdown<#article/comment/id#>"><#article/comment/bury#></span>)&nbsp;<a class='comment-reply-link' href='#respond' onclick="RevertComment('<#article/comment/id#>')">回复</a>		</div>
		</div>
	</li>
</ol>
