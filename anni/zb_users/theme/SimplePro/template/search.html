<#TEMPLATE_HEADER#>
	<title><#ZC_BLOG_TITLE#><#ZC_MSG044#><#BlogTitle#></title>
</head>
<body class="home blog">
<div id="wrap" class="container clearfix">
	<div class="header_wrap">
		<div id="header" class="clearfix">
			<div id="logo">
				<h2><a href="<#ZC_BLOG_HOST#>" title="<#ZC_BLOG_TITLE#>" rel="home bookmark"><#ZC_BLOG_TITLE#></a></h2>
			</div><!-- END logo --> 
		</div><!-- END header -->
		<label for="menu-toggle" class="navbar-toggle collapsed">
			<span class="icon-bar"></span>
			<span class="icon-bar"></span>
			<span class="icon-bar"></span>
		</label>
		<div id="navigation" class="clearfix">
		<input type="checkbox" id="menu-toggle" class="hidden"/>
		<ul class="sf-menu navbar-nav">
			<#CACHE_INCLUDE_NAVBAR#>
		</ul>
		</div><!-- END navigation -->
	</div>
	
	<div id="main" class="container">
		<div class="content alpha">
			<div class="content alpha">

					<div class="entry clearfix">
						<h1><a class="post-title" href="<#article/url#>" rel="bookmark"><#article/title#></a></h1>	
					<div class="post-meta"></div><!-- END post-meta --> 
						<div class="clear"></div>
						<div class="entry-content">
							<#article/content#>
						</div><!-- END post-bottom -->
						
						</div><!-- END entry -->

				</div><!-- END content -->   
			<div class="pagination clearfix"></div>
		</div><!-- END content --> 
		   
		<div id="sidebar" class="sidebar alpha omega"> 
			<#template:sidebar#>
		</div><!-- END sidebar -->
	</div><!-- END container -->
</div><!-- END wrap --> 
<div id="shangxia"><div id="shang"></div><div id="xia"></div></div>
